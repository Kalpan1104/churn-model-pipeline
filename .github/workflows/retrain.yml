name: Retrain and Promote

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: production-model
  cancel-in-progress: false

jobs:
  retrain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check model files are not corrupted by a bad merge
        run: |
          if grep -nE '^(<<<<<<<|=======|>>>>>>>)' models/production_metrics.json models/MODEL_CARD.md; then
            echo "::error::Unresolved git merge-conflict markers in models/. Fix them locally, commit and push, then re-run."
            exit 1
          fi
          python -c "import json; json.load(open('models/production_metrics.json'))"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate this run's training data
        run: |
          SEED=$(date +%G%V)
          python -m src.generate_data --out data/train_latest.csv --n 4000 --seed "$SEED"

      - name: Train candidate model
        run: python -m src.train --data data/train_latest.csv --out-model models/candidate_model.joblib

      - name: Evaluate candidate against fixed holdout
        run: python -m src.evaluate --model models/candidate_model.joblib --holdout data/holdout_test.csv --out models/candidate_metrics.json

      - name: Decide promotion
        id: promote
        run: python -m src.promote

      - name: Commit promoted model
        if: steps.promote.outputs.promoted == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add models/production_model.joblib models/production_metrics.json models/MODEL_CARD.md
          git diff --staged --quiet || git commit -m "Promote retrained model ($(date -u +%Y-%m-%d))"
          # pick up anything pushed to main while this job was running, then push
          git pull --rebase origin main
          git push origin HEAD:main
