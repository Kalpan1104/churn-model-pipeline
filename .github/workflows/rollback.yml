name: Rollback Production Model

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Commit SHA to roll back to (leave blank to use the previously promoted commit)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  rollback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine rollback target
        id: target
        run: |
          if [ -n "${{ github.event.inputs.commit_sha }}" ]; then
            TARGET="${{ github.event.inputs.commit_sha }}"
          else
            TARGET=$(git log --format="%H" -- models/production_model.joblib | sed -n '2p')
          fi
          if [ -z "$TARGET" ]; then
            echo "No earlier promoted model found to roll back to." >&2
            exit 1
          fi
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"

      - name: Restore model files from target commit
        run: git checkout "${{ steps.target.outputs.target }}" -- models/production_model.joblib models/production_metrics.json

      - name: Commit rollback
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          echo "- **$(date -u +"%Y-%m-%d %H:%M UTC")** — rolled back to commit ${{ steps.target.outputs.target }}" >> models/MODEL_CARD.md
          git add models/production_model.joblib models/production_metrics.json models/MODEL_CARD.md
          git diff --staged --quiet || git commit -m "Rollback production model to ${{ steps.target.outputs.target }}"
          git push
